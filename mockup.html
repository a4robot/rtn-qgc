<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QGC Boat Fly View Mockup - Minimal</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #1e1e1e;
            overflow: hidden;
            color: #ffffff;
        }

        /* Mock Map Background */
        .map-background {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: url('https://a.tile.openstreetmap.org/15/5277/12665.png'), url('https://b.tile.openstreetmap.org/15/5278/12665.png');
            background-size: cover;
            background-position: center;
            filter: brightness(0.5) saturate(1.2); /* Darken map slightly for UI contrast */
            z-index: 1;
        }

        /* Container for all left-anchored UI */
        .left-panel {
            position: absolute;
            top: 10px;
            left: 10px;
            width: 90px; /* Much narrower, 3-4x smaller than 320px */
            z-index: 10;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        /* Common Panel Style */
        .panel {
            background-color: rgba(20, 20, 20, 0.7);
            border-radius: 8px;
            padding: 8px;
            backdrop-filter: blur(4px);
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* --- Telemetry Styles --- */
        .telemetry-section {
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-bottom: 12px;
        }

        /* RPM Gauge */
        .rpm-container {
            width: 74px;
            height: 50px;
            position: relative;
        }
        .rpm-val {
            position: absolute;
            bottom: -5px;
            width: 100%;
            text-align: center;
            font-size: 11px;
            font-weight: bold;
        }

        /* Rudder */
        .rudder-container {
            width: 74px;
            height: 30px;
            position: relative;
            margin-top: 10px;
        }

        /* Vertical Scales */
        .v-scales-container {
            display: flex;
            justify-content: space-between;
            width: 74px;
            height: 80px;
            margin-top: 10px;
        }
        .v-scale {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 20px;
        }
        .v-scale-bar {
            position: relative;
            width: 10px;
            height: 60px;
        }
        .v-label {
            font-size: 9px;
            margin-top: 4px;
            color: #ccc;
        }

        /* Minimal White SVG styling */
        svg.minimal {
            display: block;
            width: 100%;
            height: 100%;
            overflow: visible;
        }

        /* --- Control Styles --- */
        .control-grid {
            display: flex;
            flex-direction: column;
            gap: 8px;
            width: 100%;
        }

        .btn {
            background: transparent;
            border: 1px solid rgba(255,255,255,0.3);
            color: white;
            border-radius: 6px;
            width: 100%;
            aspect-ratio: 1; /* Make them square */
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.2s;
            padding: 4px;
            box-sizing: border-box;
        }

        .btn:hover {
            background-color: rgba(255,255,255,0.1);
        }

        .btn.active {
            background-color: rgba(41, 128, 185, 0.4);
            border-color: #3498db;
        }

        .btn-icon {
            width: 22px;
            height: 22px;
            fill: currentColor;
            margin-bottom: 2px;
        }

        .btn-lbl {
            font-size: 8px;
            text-align: center;
            line-height: 1;
        }
    </style>
</head>
<body>

    <!-- Background Map -->
    <div class="map-background"></div>

    <!-- Left Anchor Container -->
    <div class="left-panel">

        <!-- Telemetry Panel -->
        <div class="panel">

            <!-- RPM -->
            <div class="telemetry-section">
                <div class="rpm-container">
                    <svg class="minimal" viewBox="0 0 100 60">
                        <!-- Scale Arc -->
                        <path d="M 10 50 A 40 40 0 0 1 90 50" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round"/>
                        <!-- Ticks -->
                        <line x1="10" y1="50" x2="15" y2="50" stroke="#fff" stroke-width="2"/>
                        <line x1="21.7" y1="21.7" x2="25.2" y2="25.2" stroke="#fff" stroke-width="2"/>
                        <line x1="50" y1="10" x2="50" y2="15" stroke="#fff" stroke-width="2"/>
                        <line x1="78.3" y1="21.7" x2="74.8" y2="25.2" stroke="#fff" stroke-width="2"/>
                        <line x1="90" y1="50" x2="85" y2="50" stroke="#fff" stroke-width="2"/>
                        <!-- Needle -->
                        <line x1="50" y1="50" x2="35" y2="15" stroke="#fff" stroke-width="2" stroke-linecap="round" />
                        <circle cx="50" cy="50" r="3" fill="#fff"/>
                    </svg>
                    <div class="rpm-val">2.4k</div>
                </div>
            </div>

            <!-- Rudder -->
            <div class="telemetry-section">
                <div class="rudder-container">
                    <svg class="minimal" viewBox="0 0 100 30">
                        <!-- Horizontal Scale -->
                        <line x1="5" y1="15" x2="95" y2="15" stroke="#fff" stroke-width="2"/>
                        <!-- Center Tick -->
                        <line x1="50" y1="10" x2="50" y2="20" stroke="#fff" stroke-width="2"/>
                        <!-- L/R Ticks -->
                        <line x1="5" y1="12" x2="5" y2="18" stroke="#fff" stroke-width="2"/>
                        <line x1="95" y1="12" x2="95" y2="18" stroke="#fff" stroke-width="2"/>
                        <!-- Indicator -->
                        <polygon points="70,5 65,15 75,15" fill="#fff"/>
                        <text x="5" y="28" fill="#fff" font-size="10" font-family="sans-serif">L</text>
                        <text x="85" y="28" fill="#fff" font-size="10" font-family="sans-serif">R</text>
                    </svg>
                </div>
            </div>

            <!-- Vertical Scales (Trim, Fuel, Batt) -->
            <div class="v-scales-container">
                <!-- Trim -->
                <div class="v-scale">
                    <div class="v-scale-bar">
                        <svg class="minimal" viewBox="0 0 20 100">
                            <line x1="10" y1="5" x2="10" y2="95" stroke="#fff" stroke-width="2"/>
                            <!-- Ticks -->
                            <line x1="5" y1="5" x2="15" y2="5" stroke="#fff" stroke-width="2"/>
                            <line x1="5" y1="50" x2="15" y2="50" stroke="#fff" stroke-width="2"/>
                            <line x1="5" y1="95" x2="15" y2="95" stroke="#fff" stroke-width="2"/>
                            <!-- Indicator -->
                            <polygon points="2,40 10,45 2,50" fill="#fff"/>
                        </svg>
                    </div>
                    <div class="v-label">TRM</div>
                </div>

                <!-- Fuel -->
                <div class="v-scale">
                    <div class="v-scale-bar">
                        <svg class="minimal" viewBox="0 0 20 100">
                            <line x1="10" y1="5" x2="10" y2="95" stroke="#fff" stroke-width="2"/>
                            <!-- Ticks -->
                            <line x1="5" y1="5" x2="15" y2="5" stroke="#fff" stroke-width="2"/>
                            <line x1="7" y1="50" x2="13" y2="50" stroke="#fff" stroke-width="2"/>
                            <line x1="5" y1="95" x2="15" y2="95" stroke="#fff" stroke-width="2"/>
                            <!-- Indicator (Fill line) -->
                            <line x1="10" y1="95" x2="10" y2="25" stroke="#fff" stroke-width="4"/>
                        </svg>
                    </div>
                    <div class="v-label">FUL</div>
                </div>

                <!-- Batt -->
                <div class="v-scale">
                    <div class="v-scale-bar">
                        <svg class="minimal" viewBox="0 0 20 100">
                            <line x1="10" y1="5" x2="10" y2="95" stroke="#fff" stroke-width="2"/>
                            <!-- Ticks -->
                            <line x1="5" y1="5" x2="15" y2="5" stroke="#fff" stroke-width="2"/>
                            <line x1="7" y1="50" x2="13" y2="50" stroke="#fff" stroke-width="2"/>
                            <line x1="5" y1="95" x2="15" y2="95" stroke="#fff" stroke-width="2"/>
                            <!-- Indicator (Fill line) -->
                            <line x1="10" y1="95" x2="10" y2="15" stroke="#fff" stroke-width="4"/>
                        </svg>
                    </div>
                    <div class="v-label">BAT</div>
                </div>
            </div>

        </div>

        <!-- Interactive Control Panel -->
        <div class="panel">
            <div class="control-grid">

                <!-- Trim Up -->
                <button class="btn">
                    <svg class="btn-icon" viewBox="0 0 24 24"><path d="M12 4l-8 8h16z"/></svg>
                    <span class="btn-lbl">TRIM<br>UP</span>
                </button>

                <!-- Trim Down -->
                <button class="btn">
                    <svg class="btn-icon" viewBox="0 0 24 24"><path d="M12 20l8-8H4z"/></svg>
                    <span class="btn-lbl">TRIM<br>DN</span>
                </button>

                <!-- Nav -->
                <button class="btn active">
                    <svg class="btn-icon" viewBox="0 0 24 24"><path d="M12 2a2 2 0 0 1 2 2v2a2 2 0 0 1-4 0V4a2 2 0 0 1 2-2zm6.36 4.64a2 2 0 0 1 0 2.83l-1.42 1.41a2 2 0 0 1-2.83-2.83l1.41-1.41a2 2 0 0 1 2.84 0zM22 12a2 2 0 0 1-2 2h-2a2 2 0 0 1 0-4h2a2 2 0 0 1 2 2zM12 22a2 2 0 0 1-2-2v-2a2 2 0 0 1 4 0v2a2 2 0 0 1-2 2zm-6.36-4.64a2 2 0 0 1 0-2.83l1.42-1.41a2 2 0 0 1 2.83 2.83l-1.41 1.41a2 2 0 0 1-2.84 0zM2 12a2 2 0 0 1 2-2h2a2 2 0 0 1 0 4H4a2 2 0 0 1-2-2zm4.64-6.36a2 2 0 0 1 2.83 0l1.41 1.42a2 2 0 0 1-2.83 2.83L6.64 8.47a2 2 0 0 1 0-2.83zM18.36 18.36a2 2 0 0 1-2.83 0l-1.41-1.42a2 2 0 0 1 2.83-2.83l1.41 1.42a2 2 0 0 1 0 2.83z"/></svg>
                    <span class="btn-lbl">NAV</span>
                </button>

                <!-- Siren -->
                <button class="btn">
                    <svg class="btn-icon" viewBox="0 0 24 24"><path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5a2.5 2.5 0 0 1 0-5 2.5 2.5 0 0 1 0 5z"/></svg>
                    <span class="btn-lbl">SIREN</span>
                </button>

                <!-- Head -->
                <button class="btn">
                    <svg class="btn-icon" viewBox="0 0 24 24"><path d="M9 21h6v-2H9v2zm3-19C7.86 2 4 5.86 4 10.5 4 13.56 5.67 16.2 8 17.65V19h8v-1.35c2.33-1.45 4-4.09 4-7.15C20 5.86 16.14 2 12 2zm3 14H9v-2h6v2z"/></svg>
                    <span class="btn-lbl">HEAD</span>
                </button>

                <!-- Port/Stbd -->
                <button class="btn">
                    <svg class="btn-icon" viewBox="0 0 24 24"><path d="M21 3H3v18h18V3zM12 19H5V5h7v14zm7 0h-5V5h5v14z"/></svg>
                    <span class="btn-lbl">PORT<br>STBD</span>
                </button>

            </div>
        </div>
    </div>

</body>
</html>

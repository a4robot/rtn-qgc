<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QGC Boat Fly View Mockup</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #1e1e1e;
            overflow: hidden;
            color: #ffffff;
        }

        /* Mock Map Background */
        .map-background {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: url('https://a.tile.openstreetmap.org/15/5277/12665.png'), url('https://b.tile.openstreetmap.org/15/5278/12665.png');
            background-size: cover;
            background-position: center;
            filter: brightness(0.6) saturate(1.2); /* Darken map slightly for UI contrast */
            z-index: 1;
        }

        /* Container for all left-anchored UI */
        .left-panel {
            position: absolute;
            top: 20px;
            left: 20px;
            width: 320px;
            z-index: 10;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        /* Common Panel Style */
        .panel {
            background-color: rgba(30, 30, 30, 0.85);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            padding: 15px;
            backdrop-filter: blur(5px);
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }

        .panel-title {
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #aaaaaa;
            margin-bottom: 15px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            padding-bottom: 5px;
        }

        /* Telemetry Layout */
        .telemetry-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 15px;
        }

        .telemetry-col {
            display: flex;
            flex-direction: column;
            align-items: center;
            flex: 1;
        }

        .telemetry-label {
            font-size: 11px;
            color: #aaaaaa;
            margin-bottom: 5px;
        }

        .telemetry-value {
            font-size: 16px;
            font-weight: bold;
            margin-top: 5px;
        }

        /* RPM Gauge (Circular) */
        .rpm-gauge {
            position: relative;
            width: 100px;
            height: 100px;
            margin: 0 auto 15px auto;
        }

        .rpm-svg {
            width: 100%;
            height: 100%;
        }

        .rpm-center {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
        }

        .rpm-val {
            font-size: 20px;
            font-weight: bold;
        }

        .rpm-lbl {
            font-size: 10px;
            color: #aaa;
        }

        /* Vertical Scales */
        .v-scale-container {
            display: flex;
            height: 100px;
            width: 30px;
            background-color: #333;
            border-radius: 4px;
            position: relative;
            overflow: hidden;
            border: 1px solid #555;
        }

        .v-scale-fill {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            border-radius: 2px;
            transition: height 0.3s ease;
        }

        .fill-fuel { background: linear-gradient(to top, #ff3333, #ffcc00, #33cc33); height: 75%; }
        .fill-battery { background: linear-gradient(to top, #ff3333, #33cc33); height: 85%; }
        .fill-trim { background-color: #00ccff; height: 10px; bottom: 45%; } /* Indicator line */
        .trim-center-line {
            position: absolute;
            top: 50%;
            left: 0;
            width: 100%;
            height: 2px;
            background-color: rgba(255,255,255,0.5);
            z-index: 2;
        }

        /* Horizontal Scale (Rudder) */
        .h-scale-wrapper {
            margin-bottom: 15px;
        }
        .h-scale-container {
            width: 100%;
            height: 20px;
            background-color: #333;
            border-radius: 10px;
            position: relative;
            border: 1px solid #555;
            margin-top: 5px;
        }

        .h-scale-center {
            position: absolute;
            left: 50%;
            top: 0;
            height: 100%;
            width: 2px;
            background-color: rgba(255,255,255,0.5);
        }

        .h-scale-indicator {
            position: absolute;
            left: 65%; /* positive rudder */
            top: 2px;
            height: 16px;
            width: 16px;
            background-color: #ff9900;
            border-radius: 50%;
            transform: translateX(-50%);
        }

        /* Controls Layout */
        .control-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        .btn {
            background-color: #333;
            border: 1px solid #555;
            color: white;
            padding: 10px;
            border-radius: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            cursor: pointer;
            font-size: 12px;
            transition: all 0.2s;
        }

        .btn:hover {
            background-color: #444;
        }

        .btn.active {
            background-color: #1a5276;
            border-color: #2980b9;
            box-shadow: 0 0 8px rgba(41, 128, 185, 0.6);
        }

        .btn-icon {
            width: 18px;
            height: 18px;
            fill: currentColor;
        }

        .btn.active .btn-icon {
            fill: #64b5f6;
        }

        .alert-bar {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            background-color: rgba(231, 76, 60, 0.9);
            color: white;
            text-align: center;
            padding: 10px;
            font-weight: bold;
            z-index: 100;
            display: none; /* Hidden by default */
        }
    </style>
</head>
<body>

    <div class="alert-bar" id="low-fuel-alert">
        WARNING: LOW FUEL LEVEL
    </div>

    <!-- Background Map -->
    <div class="map-background"></div>

    <!-- Left Anchor Container -->
    <div class="left-panel">

        <!-- Telemetry Panel -->
        <div class="panel">
            <div class="panel-title">Telemetry</div>

            <!-- RPM -->
            <div class="rpm-gauge">
                <svg class="rpm-svg" viewBox="0 0 100 100">
                    <path d="M 20 80 A 45 45 0 1 1 80 80" fill="none" stroke="#333" stroke-width="8" stroke-linecap="round"/>
                    <path d="M 20 80 A 45 45 0 0 1 70 20" fill="none" stroke="#2ecc71" stroke-width="8" stroke-linecap="round"/>
                    <!-- Needle -->
                    <line x1="50" y1="50" x2="65" y2="25" stroke="#ffcc00" stroke-width="3" stroke-linecap="round" />
                    <circle cx="50" cy="50" r="4" fill="#fff"/>
                </svg>
                <div class="rpm-center">
                    <div class="rpm-val">2400</div>
                    <div class="rpm-lbl">RPM</div>
                </div>
            </div>

            <!-- Rudder Horizontal Scale -->
            <div class="h-scale-wrapper">
                <div style="display:flex; justify-content:space-between; font-size:11px; color:#aaa;">
                    <span>L</span>
                    <span>RUDDER</span>
                    <span>R</span>
                </div>
                <div class="h-scale-container">
                    <div class="h-scale-center"></div>
                    <div class="h-scale-indicator"></div>
                </div>
                <div style="text-align:center; font-size:12px; font-weight:bold; margin-top:3px;">+15&deg;</div>
            </div>

            <!-- Vertical Scales: Trim, Fuel, Battery -->
            <div class="telemetry-row">
                <div class="telemetry-col">
                    <div class="telemetry-label">TRIM</div>
                    <div class="v-scale-container">
                        <div class="trim-center-line"></div>
                        <div class="v-scale-fill fill-trim"></div>
                    </div>
                    <div class="telemetry-value">+2&deg;</div>
                </div>

                <div class="telemetry-col">
                    <div class="telemetry-label">FUEL</div>
                    <div class="v-scale-container">
                        <div class="v-scale-fill fill-fuel"></div>
                    </div>
                    <div class="telemetry-value">75%</div>
                </div>

                <div class="telemetry-col">
                    <div class="telemetry-label">BATT</div>
                    <div class="v-scale-container">
                        <div class="v-scale-fill fill-battery"></div>
                    </div>
                    <div class="telemetry-value">12.4v</div>
                </div>
            </div>
        </div>

        <!-- Interactive Control Panel -->
        <div class="panel">
            <div class="panel-title">Controls</div>

            <div style="font-size:11px; color:#aaa; margin-bottom:8px;">TRIM</div>
            <div class="control-grid" style="margin-bottom:15px;">
                <button class="btn">
                    <svg class="btn-icon" viewBox="0 0 24 24"><path d="M12 4l-8 8h16z"/></svg>
                    UP
                </button>
                <button class="btn">
                    <svg class="btn-icon" viewBox="0 0 24 24"><path d="M12 20l8-8H4z"/></svg>
                    DOWN
                </button>
            </div>

            <div style="font-size:11px; color:#aaa; margin-bottom:8px;">LIGHTING</div>
            <div class="control-grid">
                <button class="btn active">
                    <svg class="btn-icon" viewBox="0 0 24 24"><path d="M12 2a2 2 0 0 1 2 2v2a2 2 0 0 1-4 0V4a2 2 0 0 1 2-2zm6.36 4.64a2 2 0 0 1 0 2.83l-1.42 1.41a2 2 0 0 1-2.83-2.83l1.41-1.41a2 2 0 0 1 2.84 0zM22 12a2 2 0 0 1-2 2h-2a2 2 0 0 1 0-4h2a2 2 0 0 1 2 2zM12 22a2 2 0 0 1-2-2v-2a2 2 0 0 1 4 0v2a2 2 0 0 1-2 2zm-6.36-4.64a2 2 0 0 1 0-2.83l1.42-1.41a2 2 0 0 1 2.83 2.83l-1.41 1.41a2 2 0 0 1-2.84 0zM2 12a2 2 0 0 1 2-2h2a2 2 0 0 1 0 4H4a2 2 0 0 1-2-2zm4.64-6.36a2 2 0 0 1 2.83 0l1.41 1.42a2 2 0 0 1-2.83 2.83L6.64 8.47a2 2 0 0 1 0-2.83zM18.36 18.36a2 2 0 0 1-2.83 0l-1.41-1.42a2 2 0 0 1 2.83-2.83l1.41 1.42a2 2 0 0 1 0 2.83z"/></svg>
                    NAV
                </button>
                <button class="btn">
                    <svg class="btn-icon" viewBox="0 0 24 24"><path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5a2.5 2.5 0 0 1 0-5 2.5 2.5 0 0 1 0 5z"/></svg>
                    SIREN
                </button>
                <button class="btn">
                    <svg class="btn-icon" viewBox="0 0 24 24"><path d="M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20zm0 18a8 8 0 1 1 0-16 8 8 0 0 1 0 16z"/></svg>
                    ALL-AROUND
                </button>
                <button class="btn">
                    <svg class="btn-icon" viewBox="0 0 24 24"><path d="M9 21h6v-2H9v2zm3-19C7.86 2 4 5.86 4 10.5 4 13.56 5.67 16.2 8 17.65V19h8v-1.35c2.33-1.45 4-4.09 4-7.15C20 5.86 16.14 2 12 2zm3 14H9v-2h6v2z"/></svg>
                    SPOT
                </button>
                <button class="btn" style="grid-column: 1 / -1;">
                    <svg class="btn-icon" viewBox="0 0 24 24"><path d="M21 3H3v18h18V3zM12 19H5V5h7v14zm7 0h-5V5h5v14z"/></svg>
                    PORT / STARBOARD
                </button>
            </div>
        </div>
    </div>

</body>
</html>
